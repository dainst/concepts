name: concepts
# Standalone compose file for concepts-application in production.

services:
  frontend:
    image: ghcr.io/dainst/concepts-frontend:5
    container_name: concepts-frontend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
#      - "traefik.http.routers.ics-ac-oauth.entrypoints=websecure"
#      - "traefik.http.routers.ics-ac-oauth.tls=true"
#      - "traefik.http.routers.ics-ac-oauth.tls.certresolver=${TLS_CERTIFICATE_RESOLVER}"
      - "traefik.http.routers.concepts-frontend.rule=Host(`${SERVER_NAME:-localhost}`)"
      - "traefik.http.routers.concepts-frontend.middlewares=security-headers,frontend-security-headers"
      - "traefik.http.services.concepts-frontend.loadbalancer.server.port=80"
      - "traefik.http.middlewares.frontend-security-headers.headers.contentSecurityPolicy=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self' https://idai.world; frame-ancestors 'none'"

  backend:
    image: ghcr.io/dainst/concepts-backend:5
    container_name: concepts-backend
    restart: unless-stopped
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD-postgres}
      DATABASE_NAME: app_db
      KEYCLOAK_URL: http://keycloak:8080
      CLIENT_SECRET: ${KC_BACKEND_CLIENT_SECRET-development-only-secret}
      CORS: ${CORS-0}
    depends_on:
      database:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      #      - "traefik.http.routers.ics-ac-oauth.entrypoints=websecure"
      #      - "traefik.http.routers.ics-ac-oauth.tls=true"
      #      - "traefik.http.routers.ics-ac-oauth.tls.certresolver=${TLS_CERTIFICATE_RESOLVER}"
      - "traefik.http.routers.concepts-backend.middlewares=security-headers"
      - "traefik.http.routers.concepts-backend.rule=Host(`${SERVER_NAME:-localhost}`) && PathPrefix(`/api`)"
      - "traefik.http.services.concepts-backend.loadbalancer.server.port=3000"
      - "traefik.http.routers.concepts-backend.middlewares=concepts-backend-strip-api"
      - "traefik.http.middlewares.concepts-backend-strip-api.stripprefix.prefixes=/api"

  traefik:
    image: traefik:v3.6
    container_name: concepts-traefik
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "8088:8080" # traefik dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    command:
      - "--global.checknewversion=false"
      - "--global.sendAnonymousUsage=false"
      - "--entrypoints.web.address=:80"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--api.dashboard=${TRAEFIK_DASHBOARD-false}"
      - "--api.insecure=${TRAEFIK_DASHBOARD-false}"
      - "--log.level=${LOG_LEVEL-ERROR}"
      - "--accesslog=${TRAEFIK_ACCESSLOG-false}"
      - "--providers.docker.watch=true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
#      - "traefik.http.middlewares.security-headers.headers.stsPreload=true" TODO activate when we have SSL
      - "traefik.http.middlewares.security-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.browserXssFilter=true"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
#    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    command: [
      'start',
      '--proxy-headers', 'xforwarded',
      '--http-enabled', 'true',
      '--import-realm'
    ]
    environment:
      KEYCLOAK_LOGLEVEL: ${LOG_LEVEL-ERROR}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD-kc_postgres}
      KC_HOSTNAME: http://${SERVER_NAME-localhost}/auth
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_NAME-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD-istrator}
      KEYCLOAK_EXTRA_ARGS_PREPENDED: "--spi-login-protocol-openid-connect-legacy-logout-redirect-uri=true"
      FRONTEND_URL: ${FRONTEND_URL-http://${HOSTNAME-localhost}}
      BACKEND_CLIENT_SECRET: ${KC_BACKEND_CLIENT_SECRET-development-only-secret}
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import
    labels:
      - "traefik.enable=true"
#      - "traefik.http.routers.keycloak.entrypoints=websecure"
#      - "traefik.http.routers.keycloak.tls=true"
#      - "traefik.http.routers.keycloak.tls.certresolver=${TLS_CERTIFICATE_RESOLVER}"
      - "traefik.http.routers.concepts-kc.rule=Host(`${SERVER_NAME:-localhost}`) && PathPrefix(`/auth`)"
      - "traefik.http.middlewares.concepts-kc-strip-auth.stripprefix.prefixes=/auth"
      - "traefik.http.routers.concepts-kc.middlewares=concepts-kc-strip-auth"
#      - "traefik.http.routers.concepts-kc.middlewares=security-headers"
      - "traefik.http.services.concepts-kc.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --head -fsS http://localhost:9000/health/ready | echo $?"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  database:
    image: postgis/postgis:18-master
    container_name: concepts-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD-postgres}
      POSTGRES_DB: app_db
      PGUSER: postgres
      KC_DB_PASSWORD: ${KC_DB_PASSWORD-kc_postgres}
    volumes:
      - concepts-database:/var/lib/postgresql
      - ./database/extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
      - ./database/app.sql:/docker-entrypoint-initdb.d/03-app.sql
      - ./database/init-kc-db.sh:/docker-entrypoint-initdb.d/04-init-kc-db.sh.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

volumes:
  concepts-database:
