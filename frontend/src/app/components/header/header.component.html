<nav id="header" class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
<!--    <a class="navbar-brand" href="#">Navbar</a>-->
<!--    <button class="navbar-toggler" type="button" >-->
<!--      <span class="navbar-toggler-icon"></span>-->
<!--    </button>-->

    <div class="pull-left">
      <div class="nav navbar-nav nav-item">
        <div ngbDropdown>
          <a href="#" ngbDropdownToggle aria-haspopup="true" aria-expanded="false">
            <img ngSrc="img/logo_idai.png" width="57" height="38" id="brand-img" alt="logo"><!-- style="height: 38px" height="38" -->
          </a>
          <ul ngbDropdownMenu class="dropdown-menu">
            <iframe src="https://idai.world/config/idai-nav.html" frameborder="0" style="width: 200px; height: 350px"></iframe>
          </ul>
        </div>
      </div>
    </div>

    <a href="/" class="pull-left ng-binding" id="project-logo"><!-- style="height: 36px;" -->
      <img ngSrc="img/logo_chronontology.png" width="36" height="36" priority alt="logo">
      <span>concepts</span>
    </a>

    <div class="collapse navbar-collapse justify-content-end">
      <ul class="navbar-nav mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item">

        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/pages/about">Über</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/pages/status">Status</a>
        </li>
      </ul>
      <form class="d-flex btn-group me-2" role="search" (ngSubmit)="search()">
        <div class="input-group">
          <input class="form-control" type="search" [(ngModel)]="queryParams.q" name="q" />
          <button class="btn btn-primary" type="submit">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </form>

      <div class="nav-item">
        @if (us.user$ | async; as user) {
          @if (us.isUser(user)) {
            <div ngbDropdown>
              <button type="button" class="nav-link" ngbDropdownToggle>
                <i class="bi bi-person-fill"></i>
              </button>
              <div ngbDropdownMenu class="dropdown-menu dropdown-menu-end">
                <div class="px-3"><small>Angemeldet als: <strong>{{user.name}}</strong></small></div>
                <hr class="dropdown-divider" />
                <button ngbDropdownItem routerLink="/concept">Neues Konzept</button>
                <a ngbDropdownItem (click)="us.openProfile()">Account</a>
                @if (user.roles.includes('admin')) {
                  <a ngbDropdownItem href="http://localhost:8080/admin/concepts/console">Administration</a>
                }
                <hr class="dropdown-divider" />
                <button ngbDropdownItem (click)="us.logout()">Abmelden</button>
              </div>
            </div>
          } @else if (user === 'error') {
            <i
              class="bi bi-exclamation-triangle-fill"
              ngbTooltip="Identitätsprovider nicht erreichbar. Login nicht möglich."
            ></i>
          } @else if (user === 'connecting') {
            <i
              class="bi bi-clock-fill"
              ngbTooltip="Identitätsprovider wird verbunden, bitte warten."
            ></i>
          } @else {
            <button class="nav-link" (click)="us.login()">
              <i
                class="bi bi-person"
                ngbTooltip="Anmelden"
              ></i>
            </button>
          }
        }
      </div>
    </div>
  </div>
</nav>
