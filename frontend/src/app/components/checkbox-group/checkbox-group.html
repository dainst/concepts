<ng-template #nodeList let-items>
  @for (option of items; track option.value) {
    <div class="form-check mb-1">
      <label class="form-check-label">
        <input
          class="form-check-input"
          type="checkbox"
          [checked]="isChecked(option)"
          [disabled]="disabled()"
          (change)="toggle(option, $any($event.target).checked)"
        />
        @if (isConceptId(option.label)) {
          {{option.label | title | async}}
        } @else {
          {{option.label}}
        }
      </label>
    </div>

    @if (option.children?.length) {
      <div class="ms-4 ps-2 border-start">
        <ng-container *ngTemplateOutlet="nodeList; context: { $implicit: option.children }" />
      </div>
    }
  }
</ng-template>

<ng-container *ngTemplateOutlet="nodeList; context: { $implicit: options() }" />
