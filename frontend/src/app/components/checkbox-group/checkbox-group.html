@for (option of options; track option) {
  <div class="form-check">
    <label class="form-check-label">
      <input
        class="form-check-input"
        type="checkbox"
        [checked]="value.includes(option)"
        [disabled]="disabled"
        (change)="toggle(option, $any($event.target).checked)"
      />
      {{ option }}
    </label>
  </div>
}
