<div class="row">
  <div class="col-5">
    <select-concept
      class="form-control form-control-sm"
      [formControl]="form().controls.predicate"
      [searchBase]="{domain: 'relations'}"
    />
  </div>
  <div class="col">
    <select-concept
      class="form-control form-control-sm"
      [formControl]="form().controls.object"
    />
  </div>
  <div class="col-auto">
    <button type="button" class="btn btn-secondary btn-sm" (click)="remove.emit()">
      <i class="bi bi-trash"></i>
    </button>
  </div>
</div>
