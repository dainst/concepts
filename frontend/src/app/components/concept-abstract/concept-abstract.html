<div class="concept-abstract">
  <h1>{{concept().title}}</h1>
  <p>{{concept().description}}</p>
  <h2>Relations</h2>
  @for(r of concept().relations; track r.relation.id) {
    <h3>{{r.relation | title | async}}</h3>
    <ul>
      @for(target of r.objects; track target.id) {
        <li>
          <a href="concept/{{target.type}}/{{target.id}}">
            {{target | title | async}}
          </a>
        </li>
      }
    </ul>
  }
</div>
