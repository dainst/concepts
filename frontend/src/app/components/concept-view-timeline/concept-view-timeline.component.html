@if (data.error()) {
  <div class="alert alert-warning" role="alert">Could not receive data for timeline</div>
}

@if (data.isLoading()) {
  <div>Timeline loading</div>
}


@if (data.value(); as periods) {
  <timeline
    style="height: 500px"
    [concepts]="periods"
    [selectedPeriodId]="selected()"
  />
}
