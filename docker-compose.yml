services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    container_name: concepts-frontend
#    volumes:
#      - ./frontend:/app
#      - ./common:/common
    ports:
      - "81:80" # TODO move to dev
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ics-ac-oauth.entrypoints=websecure"
#      - "traefik.http.routers.ics-ac-oauth.tls=true"
#      - "traefik.http.routers.ics-ac-oauth.tls.certresolver=${TLS_CERTIFICATE_RESOLVER}"
      - "traefik.http.routers.ics-ac-oauth.rule=Host(`${SERVER_NAME}`)"
      - "traefik.http.routers.ics-ac-oauth.middlewares=security-headers"
#      - "traefik.docker.network=app-net"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    container_name: concepts-backend
    ports:
      - "3000:3000" # TODO move to dev
#    volumes:
#      - ./backend:/app
#      - /app/node_modules
#      - ./common:/common
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=app_db
    depends_on:
      - database

  traefik:
    image: traefik:v3.6
    restart: always
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: always
    depends_on:
      database:
        condition: service_healthy
    command: [
      'start',
      '--proxy-headers', 'xforwarded',
      '--http-enabled', 'true',
      '--import-realm'
    ]
    environment:
      KEYCLOAK_LOGLEVEL: INFO
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: keycloak.${SERVER_NAME}
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${ADMIN_NAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      KEYCLOAK_EXTRA_ARGS_PREPENDED: "--spi-login-protocol-openid-connect-legacy-logout-redirect-uri=true"
#    env_file:
#      - config/keycloak/import/monitoring-realm.config
#    volumes:
#      - "./keycloak/realm.json:/opt/keycloak/data/import/monitoring-realm.json"
#      - "./theme:/opt/keycloak/themes/iqb"

  database:
    image: postgis/postgis:18-master
    container_name: concepts-database
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    volumes:
      - concepts-database:/var/lib/postgresq
      - ./database/extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
      - ./database/app.sql:/docker-entrypoint-initdb.d/03-app.sql
      - ./database/kc.sql:/docker-entrypoint-initdb.d/04-kc.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", "db_prod" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s

volumes:
  concepts-database:
