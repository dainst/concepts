services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    container_name: concepts-frontend
#    volumes:
#      - ./frontend:/app
#      - ./common:/common
    labels:
      - "traefik.enable=true"
#      - "traefik.http.routers.ics-ac-oauth.entrypoints=websecure"
#      - "traefik.http.routers.ics-ac-oauth.tls=true"
#      - "traefik.http.routers.ics-ac-oauth.tls.certresolver=${TLS_CERTIFICATE_RESOLVER}"
      - "traefik.http.routers.concepts-frontend.rule=Host(`${SERVER_NAME:-localhost}`)"
#      - "traefik.http.routers.ics-ac-oauth.middlewares=security-headers"
      - "traefik.http.services.concepts-frontend.loadbalancer.server.port=80"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    container_name: concepts-backend
#    volumes:
#      - ./backend:/app
#      - /app/node_modules
#      - ./common:/common
    environment:
      - DATABASE_HOST=database
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=app_db
    depends_on:
      - database
    labels:
      - "traefik.enable=true"
      #      - "traefik.http.routers.ics-ac-oauth.entrypoints=websecure"
      #      - "traefik.http.routers.ics-ac-oauth.tls=true"
      #      - "traefik.http.routers.ics-ac-oauth.tls.certresolver=${TLS_CERTIFICATE_RESOLVER}"
      #      - "traefik.http.routers.ics-ac-oauth.middlewares=security-headers"
      - "traefik.http.routers.concepts-backend.rule=Host(`${SERVER_NAME:-localhost}`) && PathPrefix(`/api`)"
      - "traefik.http.services.concepts-backend.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.concepts-backend-strip-api.stripprefix.prefixes=/api"
      - "traefik.http.routers.concepts-backend.middlewares=concepts-backend-strip-api"

  traefik:
    image: traefik:v3.6
    container_name: concepts-traefik
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "8080:8080" # traefik dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    command:
      - "--global.checknewversion=false"
      - "--global.sendAnonymousUsage=false"
      - "--entrypoints.web.address=:80"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--providers.docker.watch=true"

