services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      FRONTEND_URL: http://localhost:4200
      BACKEND_CLIENT_SECRET: development-only-secret
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import

  concepts-db:
    image: postgis/postgis:18-master
    container_name: concepts-db-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: secret_password
    volumes:
      - ./database/extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
      - ./database/app.sql:/docker-entrypoint-initdb.d/03-app.sql
      - ./database/sampledata.sql:/docker-entrypoint-initdb.d/04-sampledata.sql

networks:
  shared:
    name: concepts
    external: true
